[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citebench"
version = "0.1.0"
description = "Leakage-aware CITE-seq RNA-to-protein prediction on Apple MPS"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.4", "h5py>=3.10", "hdf5plugin>=4", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
